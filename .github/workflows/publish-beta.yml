name: Publish Beta
on:
  push:
    tags:
      - 'v*.*.*-beta.*'

jobs:
  publish-beta:
    name: Publish Beta to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build

      # Use the version derived from the git tag as the single source of truth,
      # instead of reading package.json. ${GITHUB_REF_NAME} is the tag name (e.g. v0.52.0-beta.1).
      - name: Set version from git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version from tag: $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - run: npm publish --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release (Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
